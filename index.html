<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>Maris Hardest Levels List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
        <style>
            .logo {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }
            .logo svg {
                width: 3rem;
                height: 3rem;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 2rem;
            }
            .logo-text {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }
            .logo h2 {
                margin: 0;
            }
            .logo p {
                margin: 0;
            }
        </style>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="50" cy="50" r="45" fill="#FF3333" stroke="#330000" stroke-width="3"/>
                    <!-- Horns -->
                    <path d="M 20 20 Q 10 5 15 0" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 80 20 Q 90 5 85 0" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <!-- Eyes -->
                    <ellipse cx="35" cy="40" rx="8" ry="12" fill="#00FF00"/>
                    <ellipse cx="65" cy="40" rx="8" ry="12" fill="#00FF00"/>
                    <circle cx="32" cy="38" r="3" fill="#FFF"/>
                    <circle cx="62" cy="38" r="3" fill="#FFF"/>
                    <!-- Eye mask -->
                    <path d="M 25 45 Q 50 50 75 45" stroke="#330000" stroke-width="3" fill="none"/>
                    <!-- Mouth -->
                    <rect x="30" y="65" width="40" height="8" fill="#FFF" stroke="#000" stroke-width="2" rx="2"/>
                    <line x1="35" y1="65" x2="35" y2="73" stroke="#000" stroke-width="1.5"/>
                    <line x1="42" y1="65" x2="42" y2="73" stroke="#000" stroke-width="1.5"/>
                    <line x1="50" y1="65" x2="50" y2="73" stroke="#000" stroke-width="1.5"/>
                    <line x1="58" y1="65" x2="58" y2="73" stroke="#000" stroke-width="1.5"/>
                    <line x1="65" y1="65" x2="65" y2="73" stroke="#000" stroke-width="1.5"/>
                    <!-- Mouth outline -->
                    <path d="M 30 80 Q 50 85 70 80" stroke="#CC0000" stroke-width="2" fill="none"/>
                </svg>
                <div class="logo-text">
                    <h2>Maris List</h2>
                    <p>v1.0.2</p>
                </div>
            </div>
            <div class="nav__actions">
                <!-- List record submission form, add a link to replace the '#' when putting a link to your list submission form-->
                <a
                    class="nav__cta type-label-lg"
                    href="#"
                    target="_blank"
                    >Submit Record</a
                >
            </div>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
